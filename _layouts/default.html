<!doctype html>
<html lang="{{ page.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
  <title>{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/fonts/pretendard.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#main">{{ page.skip_label | default: '본문으로 이동' }}</a>
  <header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  <nav class="document-tabs" aria-label="문서 이동">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>메인</a>
    {% assign documents = site.posts | sort: 'order' %}
    {% for document in documents %}
    <a href="{{ document.url | relative_url }}"{% if page.url == document.url %} aria-current="page"{% endif %}>{{ document.title | escape }}</a>
    {% endfor %}
  </nav>
  </header>
  <main id="main" tabindex="-1">{% if page.collection == 'posts' %}<h1>{{ page.title | escape }}</h1>{% endif %}{{ content }}</main>
</body>
</html>
