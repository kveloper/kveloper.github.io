<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <nav aria-label="언어 / Language" class="notranslate" translate="no">
    <a href="{{ '/' | absolute_url }}" lang="ko" aria-label="한국어 원문" title="한국어"><img src="{{ '/assets/kor.png' | relative_url }}" alt="한국어" width="64" height="43"></a>
    <a href="https://translate.google.com/translate?sl=ko&amp;tl=en&amp;u={{ '/' | absolute_url | url_encode }}" lang="en" aria-label="Read in English with Google Translate" title="English"><img src="{{ '/assets/eng.png' | relative_url }}" alt="English" width="64" height="43"></a>
  </nav>
  <main id="main" tabindex="-1">{{ content }}</main>
</body>
</html>
